name: SBT Build, Test & Deploy

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0 - leave empty to use tag/default)'
        required: false
        type: string

jobs:
  build-and-test:
    name: Build & Test (Scala)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm-community'
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Extract version from git tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "CI_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Run sbt Compile & Tests
        run: |
          if [ -f "engine/build.sbt" ] && [ ! -f "build.sbt" ]; then
            cd engine
          fi
          sbt compile test

  publish-maven-central:
    name: Publish to Maven Central
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm-community'
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Prepare Signing Key
        env:
          RAW_KEY: ${{ secrets.PGP_SECRET || secrets.SIGNING_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "::error::PGP_SECRET / SIGNING_KEY secret is missing!"
            exit 1
          fi

          if echo "$RAW_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            KEY="$RAW_KEY"
          else
            DECODED=$(echo "$RAW_KEY" | base64 -d 2>/dev/null || true)
            if echo "$DECODED" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
              KEY="$DECODED"
            else
              KEY="$RAW_KEY"
            fi
          fi

          KEY=$(echo "$KEY" | sed 's/\\n/\n/g')
          # sbt-ci-release expects PGP_SECRET to be a base64-encoded string without line breaks
          B64_KEY=$(printf '%s' "$KEY" | base64 -w 0)
          echo "BASE64_PGP_SECRET=$B64_KEY" >> $GITHUB_ENV

      - name: Publish to Maven Central
        run: |
          if [ -f "engine/build.sbt" ] && [ ! -f "build.sbt" ]; then
            cd engine
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "Publishing version: $VERSION"
          export CI_VERSION="$VERSION"
          sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE || secrets.SIGNING_PASSWORD }}
          PGP_SECRET: ${{ env.BASE64_PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME || secrets.MAVEN_CENTRAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD || secrets.MAVEN_CENTRAL_PASSWORD }}

  create-release:
    name: Create GitHub Release
    needs: publish-maven-central
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v0.1.0"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
