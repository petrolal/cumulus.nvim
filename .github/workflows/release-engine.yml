name: Release Engine

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Engine (Scala 3 / SBT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GraalVM Java 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run Unit Tests
        run: |
          cd engine
          sbt test

  build-native:
    name: Build Native Image (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            artifact_name: cumulus-engine-linux-x86_64
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            artifact_name: cumulus-engine-linux-aarch64
          - target: darwin-arm64
            os: macos-latest
            artifact_name: cumulus-engine-darwin-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GraalVM Java 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Compile Native Image
        run: |
          cd engine
          sbt nativeImage
          mkdir -p ../dist
          cp target/native-image/cumulus-engine ../dist/${{ matrix.artifact_name }}
          chmod +x ../dist/${{ matrix.artifact_name }}

      - name: Native Binary Smoke Test
        run: |
          ./dist/${{ matrix.artifact_name }} ping

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish-sonatype:
    name: Publish to Sonatype Maven Central
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GraalVM Java 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Publish Artifacts via sbt-ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: |
          cd engine
          sbt ci-release

  release:
    name: GitHub Release & Checksums
    needs: [build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums Manifest
        run: |
          cd release-assets
          sha256sum cumulus-engine-linux-x86_64 cumulus-engine-linux-aarch64 cumulus-engine-darwin-arm64 > checksums.sha256
          echo "Generated checksums.sha256:"
          cat checksums.sha256

      - name: Upload Release Bundle Artifact (Non-Tag CI)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: cumulus-engine-release-bundle
          path: release-assets/*

      - name: Publish GitHub Release (Tag Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cumulus-engine-linux-x86_64
            release-assets/cumulus-engine-linux-aarch64
            release-assets/cumulus-engine-darwin-arm64
            release-assets/checksums.sha256
          generate_release_notes: true
