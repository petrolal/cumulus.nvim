[package]
name = "cumulus-core"
version = "0.1.0"
edition = "2021"
authors = ["Cumulus Neovim Distribution"]
description = "High-performance Rust helper binary for Cumulus Neovim distribution"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"

[dev-dependencies]
tempfile = "3.10"
