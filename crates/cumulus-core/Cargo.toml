[package]
name = "cumulus-core"
version = "0.1.0"
edition = "2021"
authors = ["Cumulus Neovim Distribution"]
description = "High-performance Rust helper binary for Cumulus Neovim distribution"
license = "Apache-2.0"
repository = "https://github.com/petrolal/cumulus.nvim"
keywords = ["neovim", "cumulus", "cli", "parser"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"


[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"
once_cell = "1.20"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
